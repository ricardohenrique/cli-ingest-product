services:
    app:
        build: .
        command: ["sleep", "infinity"]
        working_dir: /app
        environment:
            APP_ENV: prod
            DATABASE_URL: postgresql://app:app@postgres:5432/app?serverVersion=16&charset=utf8
        volumes:
            - .:/app
            - /app/vendor
            - ./docs:/data:ro
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: app
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d app"]
            interval: 3s
            timeout: 5s
            retries: 10

volumes:
    postgres_data:
